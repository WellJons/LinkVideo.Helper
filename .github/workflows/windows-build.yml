name: Build LinkVideo.Helper

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'fix/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Complete release preflight
        shell: pwsh
        run: python scripts/release_preflight.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and verify full Setup
        shell: cmd
        run: build_setup.bat

      - name: Upload verified Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkVideo.Helper-${{ github.ref_name }}
          path: |
            release_upload/LinkVideo_VPN_Helper_Setup.exe
            release_upload/version.json
          if-no-files-found: error

      # Only a version tag may create/update the private draft release.
      # Branch and PR builds validate the exact same full Setup before a tag exists.
      - name: Create or update private draft Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "release_upload/LinkVideo_VPN_Helper_Setup.exe"
          $notes = "RELEASE_3.0.8_RU.txt"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --draft --title "LinkVideo.Helper $($tag.TrimStart('v'))" --notes-file $notes
          }
