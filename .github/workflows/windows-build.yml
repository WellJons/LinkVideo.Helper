name: Build LinkVideo.Helper

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'fix/**'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: linkvideo-helper-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Go for installer and patcher
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: |
            installer_next/go.mod
            patcher/go.mod

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Complete release preflight
        shell: pwsh
        run: python scripts/release_preflight.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and verify current Inno Setup
        shell: cmd
        run: build_setup.bat

      # 3.0.8 develops the replacement installer in parallel. It is intentionally
      # NOT used by the public update workflow until it passes real-machine tests.
      - name: Build next LinkVideo installer and uninstaller
        shell: pwsh
        run: ./scripts/build_next_installer.ps1

      - name: Compile differential patch pipeline
        shell: pwsh
        run: ./scripts/test_patch_builder.ps1

      - name: Upload verified current Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LinkVideo.Helper-build-${{ github.run_number }}-${{ github.sha }}
          path: |
            release_upload/LinkVideo_VPN_Helper_Setup.exe
            release_upload/version.json
          if-no-files-found: error

      - name: Upload next installer test build
        uses: actions/upload-artifact@v4
        with:
          name: LinkVideo.Helper-next-installer-${{ github.run_number }}-${{ github.sha }}
          path: |
            installer_next/output/LinkVideo.Helper_Setup_Next.exe
            installer_next/output/Uninstall.exe
            release_payload/LinkVideo.Helper_Payload_*.zip
            release_payload/LinkVideo.Helper_Payload_*.json
          if-no-files-found: error

      # Only a version tag may create/update the current private draft release.
      # The experimental installer above is never published by this step.
      - name: Create or update private draft Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "release_upload/LinkVideo_VPN_Helper_Setup.exe"
          $notes = "RELEASE_3.0.8_RU.txt"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --draft --title "LinkVideo.Helper $($tag.TrimStart('v'))" --notes-file $notes
          }
