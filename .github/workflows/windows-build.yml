name: Build LinkVideo.Helper

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: linkvideo-helper-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Go for installer and patcher
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: |
            installer_next/go.mod
            patcher/go.mod

      - name: Install Python audit/build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller ruff
          python -m pip check

      - name: Complete Python release preflight
        shell: pwsh
        run: python scripts/release_preflight.py

      - name: Audit Python undefined names and invalid constructs
        shell: pwsh
        run: ruff check linkvideo_vpn_helper scripts --select E9,F63,F7,F82

      - name: Audit Go installer, patcher and updater sources
        shell: pwsh
        run: |
          $goFiles = Get-ChildItem installer_next,patcher,silent_updater -Recurse -Filter *.go | ForEach-Object { $_.FullName }
          $notFormatted = @(& gofmt -l $goFiles)
          if ($notFormatted.Count -gt 0) {
            Write-Warning "Historical Go files still need a formatting-only cleanup; this does not bypass go vet."
            $notFormatted | ForEach-Object { Write-Host "gofmt diagnostic: $_" }
          }

          # Embedded payload files are generated later by the normal builders.
          # Create harmless temporary fixtures so go vet can compile every Go
          # module before any release artifact is produced.
          python -c "import zipfile; zipfile.ZipFile(r'installer_next/payload.zip','w').close(); zipfile.ZipFile(r'patcher/patch_payload.zip','w').close()"
          Set-Content -LiteralPath 'patcher/patch_manifest.json' -Value '{}' -Encoding utf8NoBOM
          try {
            Push-Location installer_next
            try { go vet ./...; if ($LASTEXITCODE -ne 0) { throw 'installer_next go vet failed' } } finally { Pop-Location }
            Push-Location patcher
            try { go vet ./...; if ($LASTEXITCODE -ne 0) { throw 'patcher go vet failed' } } finally { Pop-Location }
            Push-Location silent_updater
            try { go vet ./...; if ($LASTEXITCODE -ne 0) { throw 'silent_updater go vet failed' } } finally { Pop-Location }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue 'installer_next/payload.zip'
            Remove-Item -Force -ErrorAction SilentlyContinue 'patcher/patch_payload.zip'
            Remove-Item -Force -ErrorAction SilentlyContinue 'patcher/patch_manifest.json'
          }

      # Keep the historical Inno build as a compatibility/build-health check,
      # but it is never a release asset again.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build legacy Inno compatibility installer
        shell: cmd
        run: build_setup.bat

      - name: Build authoritative LinkVideo installer and uninstaller
        shell: pwsh
        run: ./scripts/build_next_installer.ps1

      - name: Compile differential patch pipeline
        shell: pwsh
        run: ./scripts/test_patch_builder.ps1

      - name: Upload authoritative Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: LinkVideo.Helper-release-${{ github.run_number }}-${{ github.sha }}
          path: |
            installer_next/output/LinkVideo.Helper_Setup.exe
            installer_next/output/Uninstall.exe
            release_payload/LinkVideo.Helper_Payload_*.zip
            release_payload/LinkVideo.Helper_Payload_*.json
          if-no-files-found: error

      - name: Upload legacy Inno build for compatibility diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: LinkVideo.Helper-legacy-inno-${{ github.run_number }}-${{ github.sha }}
          path: |
            release_upload/LinkVideo_VPN_Helper_Setup.exe
            release_upload/version.json
          if-no-files-found: error

      # Only a version tag may create/update the private draft release. The same
      # exact Setup is later copied by publish-public-update.yml to the public
      # WellJons/LinkVideo.Helper.Updates repository.
      - name: Create or update private draft Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $asset = "installer_next/output/LinkVideo.Helper_Setup.exe"
          $notes = "RELEASE_${version}_RU.txt"
          if (-not (Test-Path $asset)) { throw "Authoritative Setup not found: $asset" }
          if (-not (Test-Path $notes)) { throw "Release notes not found: $notes" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --draft --title "LinkVideo.Helper $version" --notes-file $notes
          }
