name: Build LinkVideo.Helper 2.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Static self-check
        shell: pwsh
        run: |
          python scripts/self_check.py
          python scripts/core_tests.py

      - name: Build application
        shell: cmd
        run: build_onedir.bat

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup and release package
        shell: cmd
        run: prepare_release.bat

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinkVideo.Helper-${{ github.ref_name }}
          path: |
            release_upload/LinkVideo.Helper_Setup.exe
            release_upload/LinkVideo.Helper_2.0_Project.zip
            release_upload/version.json
          if-no-files-found: error
