name: Helper 4 Electron Preview
on:
  push:
    branches: ['v4/electron']
    tags: ['v4.*-alpha.*', 'v4.*-beta.*', 'v4.*-rc.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: helper-v4-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release tag matches packaged version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Get-Content desktop_v4/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne ('v' + $v) -or $v -notmatch '^4\.\d+\.\d+-(alpha|beta|rc)\.\d+$') { throw 'Invalid Helper 4 release tag' }
      - name: Install Python runtime build dependencies
        run: python -m pip install -r desktop_v4/requirements-worker.txt pyinstaller
      - name: Generate legacy Qt settings migration fixture (CI only)
        shell: pwsh
        run: |
          python -m pip install 'PySide6-Essentials>=6.6,<7'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixture = Join-Path $env:RUNNER_TEMP 'lv4-legacy-servers.ini'
          python desktop_v4/legacy_settings_fixture.py $fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LV4_QT_FIXTURE=$fixture" >> $env:GITHUB_ENV
          python -m pip uninstall -y PySide6-Essentials shiboken6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None; assert importlib.util.find_spec('shiboken6') is None"
      - name: Test Python RPC without production connections
        run: python -m unittest desktop_v4.test_settings_store desktop_v4.test_worker desktop_v4.test_template_migration desktop_v4.test_delete_recovery desktop_v4.test_billing_parity desktop_v4.test_archive_report desktop_v4.test_backup_inventory desktop_v4.test_background desktop_v4.test_clipboard_images
      - name: Test full headless runtime without network
        run: python -m desktop_v4.worker --lv4-runtime-selftest
      - name: Run original 3.0.27 offline CRM protocol regression scripts
        shell: pwsh
        run: |
          $modules = @('core_tests_3_0_14_billing_auth_contract','core_tests_3_0_14_billing_token_transport','core_tests_3_0_14_billing_account_response','core_tests_3_0_14_billing_cameras_response')
          foreach ($name in $modules) {
            python -m "scripts.$name"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compile Python adapters
        run: python -m compileall -q desktop_v4 linkvideo_vpn_helper
      - name: Install Electron dependencies
        working-directory: desktop_v4
        run: npm install --no-audit --no-fund
      - name: Test Electron bridge
        working-directory: desktop_v4
        run: npm run check
      - name: Smoke test Electron workspace (offline preview)
        working-directory: desktop_v4
        env:
          LV4_SMOKE: '1'
        run: npx electron . --lv4-smoke
      - name: Build self-contained Python core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-v4-core | Out-Null
          python -m PyInstaller --noconfirm --clean --onedir --console --name helper-core --distpath dist-v4-core --workpath build-v4-core --specpath build-v4-core --paths . --exclude-module PySide6 --exclude-module shiboken6 desktop_v4/worker.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist-v4-core/helper-core dist-v4-core/worker
          $unexpected = Get-ChildItem dist-v4-core/worker -File -Recurse | Where-Object { $_.Name -match '^(Qt6.*\.dll|opengl32sw\.dll|shiboken.*\.(dll|pyd))$' -or $_.FullName -match '[\\/](PySide6|shiboken6)[\\/]' }
          if ($unexpected) { throw ('Unexpected Qt runtime bundled: ' + ($unexpected.FullName -join ', ')) }
          $files=Get-ChildItem dist-v4-core/worker -File -Recurse | Sort-Object Length -Descending
          Write-Host ('LV4_CORE_SIZE_BYTES=' + (($files | Measure-Object Length -Sum).Sum))
          $files | Select-Object -First 15 @{n='MiB';e={[math]::Round($_.Length/1MB,2)}},Name | Format-Table -AutoSize
      - name: Validate frozen core dependencies and signing offline
        shell: pwsh
        run: |
          $core = Resolve-Path 'dist-v4-core/worker/helper-core.exe'
          & $core --lv4-runtime-selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows Electron application
        working-directory: desktop_v4
        run: npm run package:win
      - name: Smoke test packaged executable with bundled Python
        shell: pwsh
        env:
          LV4_SMOKE: '1'
          LV4_METRICS_PATH: ${{ github.workspace }}/dist-v4/performance.json
        run: |
          $app = Resolve-Path 'dist-v4/LinkVideo.Helper.4-win32-x64/LinkVideo.Helper.4.exe'
          $p = Start-Process -FilePath $app -ArgumentList '--lv4-smoke' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged smoke test failed: $($p.ExitCode)" }
      - name: Record optimized runtime sizes
        shell: pwsh
        run: |
          $all=Get-ChildItem dist-v4/LinkVideo.Helper.4-win32-x64 -File -Recurse
          $total=($all | Measure-Object Length -Sum).Sum
          $worker=($all | Where-Object { $_.FullName -match '[\\/]resources[\\/]worker[\\/]' } | Measure-Object Length -Sum).Sum
          @('Total bytes: '+$total,'Python worker bytes: '+$worker,'Electron/app bytes: '+($total-$worker),'Largest 30 files:',($all | Sort-Object Length -Descending | Select-Object -First 30 @{n='MiB';e={[math]::Round($_.Length/1MB,2)}},FullName | Out-String)) | Set-Content dist-v4/size-report.txt -Encoding UTF8
          Get-Content dist-v4/size-report.txt
      - name: Build isolated Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          & ./desktop_v4/installer-brand.ps1
          & $iscc desktop_v4/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist-v4/*-Setup.exe -Algorithm SHA256 | Format-List | Out-File dist-v4/SHA256.txt
          $setup = Get-ChildItem dist-v4/*-Setup.exe | Select-Object -First 1
          Write-Host ('LV4_SETUP_BYTES=' + $setup.Length)
          Add-Content dist-v4/size-report.txt ('Installer bytes: ' + $setup.Length)
      - name: Smoke test actual installed application
        shell: pwsh
        env:
          LV4_SMOKE: '1'
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'LV4-Installer-Smoke'
          $installer = (Get-ChildItem dist-v4/*-Setup.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR="' + $dest + '"')) -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup failed: $($p.ExitCode)" }
          & (Join-Path $dest 'resources/worker/helper-core.exe') --lv4-runtime-selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Start-Process -FilePath (Join-Path $dest 'LinkVideo.Helper.4.exe') -ArgumentList '--lv4-smoke' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installed app failed: $($p.ExitCode)" }
          $uninstaller = Get-ChildItem $dest/unins*.exe | Select-Object -First 1
          if (!$uninstaller) { throw 'Missing uninstaller' }
          $p = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Uninstall failed: $($p.ExitCode)" }
      - name: Build separate protected Windows background component
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Inno Setup 6\ISCC.exe'
          & $iscc desktop_v4/background-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $local = Resolve-Path 'dist-v4-core/worker/helper-core.exe'
          $p = Start-Process -FilePath $local -ArgumentList '--lv4-background-check-installation' -PassThru -Wait
          if ($p.ExitCode -ne 3) { throw 'Unprotected worker accepted background mode' }
          Get-FileHash dist-v4-bg/*-Setup.exe -Algorithm SHA256 | Format-List | Out-File dist-v4-bg/SHA256.txt
          $setup = Get-ChildItem dist-v4-bg/*-Setup.exe | Select-Object -First 1
          Write-Host ('LV4_BACKGROUND_SETUP_BYTES=' + $setup.Length)
          Add-Content dist-v4/size-report.txt ('Background installer bytes: ' + $setup.Length)
      - name: Smoke test protected component installation only (no task or external requests)
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist-v4-bg/*-Setup.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Background component setup failed: $($p.ExitCode)" }
          $dest = Join-Path $env:ProgramFiles 'LinkVideo.Helper.4.Background'
          $p = Start-Process -FilePath (Join-Path $dest 'helper-core.exe') -ArgumentList '--lv4-background-check-installation' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Protected path/ACL check failed: $($p.ExitCode)" }
          if (Get-ScheduledTask -TaskName 'LinkVideo.Helper.4.VPNSheetsMirror' -ErrorAction SilentlyContinue) { throw 'Unexpected task created by setup' }
          $uninstaller = Get-ChildItem $dest/unins*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Background uninstall failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: LinkVideo.Helper-4-Background-Setup
          path: dist-v4-bg/
          if-no-files-found: error
          retention-days: 14
      # For employees: setup artifact contains ONE installer and no reports.
      # GitHub Actions automatically wraps downloaded artifacts in a ZIP.
      - uses: actions/upload-artifact@v4
        with:
          name: LinkVideo.Helper-4-Windows-Setup
          path: dist-v4/*-Setup.exe
          if-no-files-found: error
          retention-days: 14
      # Diagnostics are preserved separately for engineering and CI review.
      - uses: actions/upload-artifact@v4
        with:
          name: LinkVideo.Helper-4-Diagnostics
          path: |
            dist-v4/SHA256.txt
            dist-v4/performance.json
            dist-v4/size-report.txt
            dist-v4/layout/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: LinkVideo.Helper-4-Portable
          compression-level: 9
          path: dist-v4/LinkVideo.Helper.4-win32-x64/
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    if: startsWith(github.ref, 'refs/tags/v4.')
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LinkVideo.Helper-4-Windows-Setup
          path: release
      - name: Publish isolated prerelease (only explicit tag push)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^4\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]
          test -f "release/LinkVideo.Helper.${v}-Setup.exe"
          # Tagged prerelease has a direct-downloadable EXE asset, not a ZIP.
          gh release create "$GITHUB_REF_NAME" "release/LinkVideo.Helper.${v}-Setup.exe" -R "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false --title "LinkVideo.Helper ${v}" --notes 'Preview 4.0. Isolated from 3.x. Production writes disabled by default.'
